name: Build Shader Pack

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lazurite
        run: pip install lazurite

      - name: Download shaderc (Linux binary)
        run: |
          curl -L -o shaderc https://github.com/devendrn/newb-shader/releases/latest/download/shaderc-linux-x64
          chmod +x shaderc

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Sync shared files into each material's shaders folder
        run: |
          for dir in project/*/shaders; do
            if [ -d "$dir" ]; then
              cp project/lumen_graphics/settings.h "$dir/settings.h"
              cp project/lumen_graphics/bgfx_shader.sh "$dir/bgfx_shader.sh"
            fi
          done

      - name: Build materials with Lazurite
        run: lazurite build ./project -p android --shaderc ./shaderc -e lumen_graphics -o ./build/materials

      - name: Assemble resource pack
        run: |
          mkdir -p pack/renderer/materials
          cp ./build/materials/*.material.bin pack/renderer/materials/
          if [ -d "assets" ]; then
            cp -r assets/. pack/
          fi

      - name: Zip pack as mcpack
        run: |
          cd pack
          zip -r ../LumenGraphics.mcpack . -x ".*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumenGraphics-${{ steps.vars.outputs.sha_short }}
          path: LumenGraphics.mcpack
